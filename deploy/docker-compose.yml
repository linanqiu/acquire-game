version: '3.8'

services:
  buyout:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=prod
      # LLM players (optional). Set in your shell or a .env next to this file.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GAME_LLM_OPENAI_BASE_URL=${GAME_LLM_OPENAI_BASE_URL:-}
      - GAME_LLM_OPENAI_MODEL=${GAME_LLM_OPENAI_MODEL:-}
      - GAME_LLM_OPENAI_API_KEY=${GAME_LLM_OPENAI_API_KEY:-}
      - GAME_LLM_CATALOG=${GAME_LLM_CATALOG:-}
      - GAME_LLM_LOG_DIR=${GAME_LLM_LOG_DIR:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Add Redis for persistent sessions in future
  # redis:
