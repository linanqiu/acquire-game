name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests with coverage (fast + slow tiers, in parallel)
        working-directory: backend
        # pytest-cov merges the per-worker data under pytest-xdist
        run: |
          pytest -n auto --cov=game --cov=session --cov-report=xml --cov-report=term-missing -q

      - name: Acquire Bench offline smoke (fake LLM, 2 games, ~3 s)
        working-directory: backend
        env:
          ACQUIRE_TEST_MODE: '1'
        run: |
          python -m bench run --protocol acquire-bench-v1 --models llm:fake \
            --track vs-baseline --games 2 --out "$RUNNER_TEMP/bench-smoke" --json --quiet \
            > "$RUNNER_TEMP/bench-smoke.json"
          python -c "import json,sys; s=json.load(open(sys.argv[1])); assert s['status']=='complete' and s['games']['ran']==2, s" "$RUNNER_TEMP/bench-smoke.json"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: ruff check backend/

      - name: Run Ruff formatter check
        run: ruff format --check backend/

      - name: Surface coverage map (every surface names a test that exists)
        run: python scripts/check-surface-coverage.py

  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

  # Browser tiers 3 (screens), 4 (journeys) and the transcripts journey, one parallel job each.
  # Each job starts its own backend (ACQUIRE_TEST_MODE=1) and Vite dev server through the
  # Playwright webServer config. Tracing is off (screenshots are the evidence).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project: [screens, journeys, transcripts]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.project }} tests
        working-directory: frontend
        run: npx playwright test --project=${{ matrix.project }} --trace off --reporter=list,html

      - name: Upload screenshots and report
        uses: actions/upload-artifact@v4
        # Journeys always (their screenshots are the proof they ran); the others on failure.
        if: failure() || matrix.project == 'journeys'
        with:
          name: playwright-${{ matrix.project }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, frontend-lint, e2e]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: acquire-game:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
